name: API ingestion hardening

on:
  pull_request:
    paths:
      - "apps/api/**"
      - ".github/workflows/api-ingestion-hardening.yml"
  push:
    branches:
      - feat/ingestion-infrastructure-hardening
    paths:
      - "apps/api/**"
      - ".github/workflows/api-ingestion-hardening.yml"

jobs:
  api-hardening:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/oberyn_test
      TEST_REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - name: Install API dependencies
        run: python -m pip install -e "apps/api[dev]"
      - name: Lint API
        working-directory: apps/api
        run: ruff check app tests migrations/versions/0007_ingestion_hardening.py
      - name: Check formatting
        working-directory: apps/api
        run: ruff format --check app tests migrations/versions/0007_ingestion_hardening.py
      - name: Run ingestion and Redis integration tests
        working-directory: apps/api
        run: pytest -q tests/test_ingest.py tests/test_ingestion_limits.py

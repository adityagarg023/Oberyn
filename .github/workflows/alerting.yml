name: Alerting engine

on:
  pull_request:
    paths:
      - "apps/api/**"
      - "apps/workers/**"
      - ".github/workflows/alerting.yml"
  push:
    branches:
      - feat/alerting-engine
    paths:
      - "apps/api/**"
      - "apps/workers/**"
      - ".github/workflows/alerting.yml"

jobs:
  alerting:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: oberyn
          POSTGRES_PASSWORD: oberyn
          POSTGRES_DB: oberyn_runtime
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U oberyn -d oberyn_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://oberyn:oberyn@localhost:5432/oberyn_runtime
      TEST_DATABASE_URL: postgresql+asyncpg://oberyn:oberyn@localhost:5432/oberyn_test
      REDIS_URL: redis://localhost:6379/1
      TEST_REDIS_URL: redis://localhost:6379/1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            apps/api/pyproject.toml
            apps/workers/pyproject.toml
      - name: Install API and worker dependencies
        run: python -m pip install -e "apps/api[dev]" -e "apps/workers[dev]"
      - name: Create isolated test database
        env:
          PGPASSWORD: oberyn
        run: createdb -h localhost -U oberyn oberyn_test
      - name: Apply database migrations
        working-directory: apps/api
        run: |
          alembic upgrade head
          DATABASE_URL="$TEST_DATABASE_URL" alembic upgrade head
      - name: Lint API and workers
        run: |
          cd apps/api && ruff check app tests migrations/versions/0007_ingestion_hardening.py migrations/versions/0008_alert_delivery.py
          cd ../workers && ruff check workers tests
      - name: Check formatting
        run: |
          cd apps/api && ruff format --check app tests migrations/versions/0007_ingestion_hardening.py migrations/versions/0008_alert_delivery.py
          cd ../workers && ruff format --check workers tests
      - name: Type check workers
        working-directory: apps/workers
        run: mypy workers
      - name: Run API and worker tests
        run: |
          cd apps/api && pytest -q
          cd ../workers && pytest -q
